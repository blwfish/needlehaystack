[project]
name = "needlestack"
version = "0.2.0"
description = "Find photos by describing what's in them"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0.0,<3",
    "open-clip-torch>=2.20.0,<3",
    "Pillow>=10.0.0,<11",
    "rawpy>=0.18.0",
    "numpy>=1.24.0,<2",
    "httpx>=0.25.0,<1",
    "rich>=13.0.0,<14",
    "fastapi>=0.100.0,<1",
    "uvicorn[standard]>=0.23.0,<1",
    "click>=8.0.0,<9",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
needlestack = "needlestack.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
needlestack = ["ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
