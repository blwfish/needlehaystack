[project]
name = "needlestack"
version = "0.4.0"
description = "Find photos by describing what's in them"
requires-python = ">=3.12"
dependencies = [
    "needlestack-core @ git+https://github.com/blwfish/needlestack-core@674dd107534f14c3581162e94e5f7318fa4800c4",
    "Pillow>=10.0.0,<11",
    "rawpy>=0.18.0",
    "rich>=13.0.0,<14",
    "fastapi>=0.100.0,<1",
    "uvicorn[standard]>=0.23.0,<1",
    "click>=8.0.0,<9",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
needlestack = "needlestack.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
needlestack = ["ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: requires Ollama running locally and network access (deselect with -m 'not integration')",
]
