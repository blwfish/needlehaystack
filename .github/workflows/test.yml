name: tests

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install CPU-only PyTorch
        # Install torch before the rest so pip sees it as already satisfied
        # and doesn't pull the large CUDA build when resolving open-clip-torch.
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project and test dependencies
        run: pip install -e ".[test]"

      - name: Run unit tests
        run: pytest -m "not integration"

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Install wheel into fresh environment and smoke-test
        run: |
          python -m venv dist-venv
          dist-venv\Scripts\pip install torch --index-url https://download.pytorch.org/whl/cpu
          dist-venv\Scripts\pip install (Get-Item dist\*.whl).FullName
          dist-venv\Scripts\needlestack --version
        shell: pwsh
